<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6673"/>
      <stop offset="1" stop-color="#39424d"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#d3d8de"/>
    </linearGradient>
  </defs>

  <!-- Body: the squat square of a 4th generation shuffle. -->
  <rect x="18" y="18" width="92" height="92" rx="20" fill="url(#body)"/>
  <rect x="18" y="18" width="92" height="92" rx="20" fill="none"
        stroke="#2a313a" stroke-width="2"/>

  <!-- Control pad. -->
  <circle cx="64" cy="64" r="33" fill="url(#pad)"/>
  <circle cx="64" cy="64" r="11" fill="#c3c9d1"/>
  <circle cx="64" cy="64" r="11" fill="none" stroke="#aeb5bf" stroke-width="1.5"/>

  <!-- Transport marks: play, back, forward, and the volume pair. -->
  <g fill="#5b6673">
    <path d="M61 58.5v11l9-5.5z"/>
    <path d="M35.5 64l7-4.5v9zM45 59.5v9h-2.5v-9z" transform="translate(3,0)"/>
    <path d="M92.5 64l-7-4.5v9zM83 59.5v9h2.5v-9z" transform="translate(-3,0)"/>
    <rect x="59" y="35" width="10" height="2.6" rx="1.3"/>
    <rect x="59" y="90.4" width="10" height="2.6" rx="1.3"/>
    <rect x="62.7" y="86.7" width="2.6" height="10" rx="1.3"/>
  </g>
</svg>
