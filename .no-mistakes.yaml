---
# The iPod's device-changing paths justify one automatic repair pass before
# and one after an intent-sensitive review decision. Keep this repository-local:
# every attempt is another complete diff review.
auto_fix:
  review: 2

commands:
  lint: |
    shellcheck -x ./*.sh tests/product-e2e.sh &&
    bash -c '
      set -euo pipefail
      source ./lib.sh
      # The installed environment when there is one, so these read the modules
      # the application runs. Neither check needs GTK - one walks the source
      # with ast and the other compiles without importing - so a checkout with
      # no bindings yet says so and carries on rather than failing silently.
      if ! python="$(find_gui_python 2>/dev/null)"; then
        python="$(system_python)" \
          || { echo "lint needs a python3 interpreter" >&2; exit 1; }
        echo "lint: no interpreter with the GTK4 bindings; using $python" >&2
      fi
      "$python" tools/mixin-contract.py
      "$python" -m py_compile \
        ipod-gui.py ipod-report.py ipod_gui/*.py tests/*.py tools/*.py
    '

ignore_patterns:
  - ".no-mistakes/**"
