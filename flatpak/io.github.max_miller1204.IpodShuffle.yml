---
# Source URLs and checksums are kept intact for reproducible Flatpak builds.
# yamllint disable rule:line-length
app-id: io.github.max_miller1204.IpodShuffle
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: ipod-shuffle

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri

  # Mounting, unmounting and relabelling all go through UDisks2 rather than
  # privileged helpers. Polkit still arbitrates, and grants these operations on
  # removable media to the logged-in user without a password, so the sandbox
  # needs no elevated rights of its own.
  - --system-talk-name=org.freedesktop.UDisks2

  # Where UDisks2 mounts removable volumes. Both are in use across distributions.
  - --filesystem=/media
  - --filesystem=/run/media

  # Reading the music being copied across, and writing backups before a wipe.
  - --filesystem=home

modules:
  # espeak-ng rather than SVOX Pico. Pico is unmaintained 2013 code, and the
  # build produced here is non-deterministic: the same text yields different
  # audio on every run, the signature of reading uninitialised memory. That
  # survived -O0 -fno-strict-aliasing -fwrapv, and Debian's working package is
  # built from a different patch set than the fork packaged here. espeak-ng is
  # maintained, builds cleanly, and the database builder already supports it.
  # The native install still prefers pico2wave, where it works correctly.
  - name: espeak-ng
    buildsystem: autotools
    config-opts:
      - --without-pcaudiolib
      - --without-klatt
      - --without-speechplayer
      - --without-mbrola
    build-options:
      env:
        # Upstream regenerates dictionaries during the build and needs to find
        # its own freshly built data rather than any copy already on the system.
        ESPEAK_DATA_PATH: /app/share/espeak-ng-data
    post-install:
      # The database builder invokes the binary as `espeak`, which is the
      # traditional name; upstream installs `espeak-ng` and ships the compat
      # wrapper only in some packagings, so it is created explicitly here.
      - ln -sf espeak-ng /app/bin/espeak

      # It also hardcodes `-v english_rp`, the voice name from espeak 1.48.
      # espeak-ng renamed that voice to en-gb-x-rp and rejects the old name
      # outright, which would fail every synthesis. Rather than fork the
      # GPL-2.0-only builder to change one string, the old name is provided
      # as an alias of the same voice definition.
      - sed 's/^name .*/name english_rp/'
        /app/share/espeak-ng-data/lang/gmw/en-GB-x-rp
        > /app/share/espeak-ng-data/lang/gmw/english_rp

      - install -Dm644 COPYING /app/share/licenses/espeak-ng/COPYING
    sources:
      - type: archive
        url: https://github.com/espeak-ng/espeak-ng/archive/refs/tags/1.52.0.tar.gz
        sha256: bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23

  - name: python3-mutagen
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index
        --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation mutagen
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/df/70/1675da133ea92227da41bf5b24e1c66be597ff736a1533ade41da986852f/mutagen-1.48.1.tar.gz
        sha256: 8f95637ab9f6f305cec6bd1294e197debe207998e3e068596563c74f86b0a173

  # The reverse-engineered iTunesSD writer. Pinned to a commit rather than a
  # branch so a rebuild is reproducible, and kept as a separate module so its
  # GPL-2.0-only history stays distinct from this wrapper.
  - name: ipod-shuffle-4g
    buildsystem: simple
    build-commands:
      - install -Dm755 ipod-shuffle-4g.py
        /app/share/ipod-shuffle/IPod-Shuffle-4g/ipod-shuffle-4g.py
      - install -Dm644 COPYING
        /app/share/licenses/ipod-shuffle/COPYING.IPod-Shuffle-4g
    sources:
      - type: git
        url: https://github.com/nims11/IPod-Shuffle-4g.git
        commit: a97a99ab8623f0eccc5adcb8ebbdb2e626c6c703

  - name: ipod-shuffle
    buildsystem: simple
    build-commands:
      - install -Dm644 lib.sh          /app/share/ipod-shuffle/lib.sh
      - install -Dm755 ipod-sync.sh    /app/share/ipod-shuffle/ipod-sync.sh
      - install -Dm755 ipod-wipe.sh    /app/share/ipod-shuffle/ipod-wipe.sh
      - install -Dm755 ipod-gui.py     /app/share/ipod-shuffle/ipod-gui.py
      - install -Dm755 flatpak/ipod-shuffle-launcher /app/bin/ipod-shuffle
      - install -Dm644 flatpak/io.github.max_miller1204.IpodShuffle.desktop
        /app/share/applications/io.github.max_miller1204.IpodShuffle.desktop
      - install -Dm644 flatpak/io.github.max_miller1204.IpodShuffle.metainfo.xml
        /app/share/metainfo/io.github.max_miller1204.IpodShuffle.metainfo.xml
      - install -Dm644 flatpak/io.github.max_miller1204.IpodShuffle.svg
        /app/share/icons/hicolor/scalable/apps/io.github.max_miller1204.IpodShuffle.svg
      - install -Dm644 LICENSE /app/share/licenses/ipod-shuffle/LICENSE

      # The speech engine must satisfy the detection the GUI performs, under
      # the traditional name the database builder invokes.
      - python3 -c 'import shutil;
        assert shutil.which("espeak") == "/app/bin/espeak"'

      # It must produce real audio, not merely exist. A WAV holding no samples
      # is exactly its 44-byte canonical header, so anything larger has sound
      # in it. The arguments mirror what the database builder actually passes.
      - espeak -v english_rp -s 150 -w speech-check.wav -- "Voiceover check"
      - test "$(wc -c < speech-check.wav)" -gt 44

      # And it must be deterministic. The engine this replaced returned
      # different audio for identical input on every run, which reached the
      # device as playlists that could not be told apart, so the property that
      # failed before is asserted here rather than assumed.
      - espeak -v english_rp -s 150 -w speech-repeat.wav -- "Voiceover check"
      - cmp speech-check.wav speech-repeat.wav
      - rm speech-check.wav speech-repeat.wav
    sources:
      - type: dir
        path: ..
