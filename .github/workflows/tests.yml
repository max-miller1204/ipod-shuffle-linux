---
name: tests

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7

      # The bindings come from the distribution because building PyGObject from
      # pip would need the gobject-introspection and cairo development headers,
      # and the application package imports GTK at module level, so even the
      # checks that never open a window need them. GTK4 has no headless
      # backend, so the checks that do build a window need xvfb rather than an
      # environment variable. dbus brings dbus-run-session, which
      # tools/headless-run.py gives each of those checks its own session bus
      # with; named as dbus rather than as the dbus-daemon package holding the
      # binary, because that split is recent enough that only some releases
      # have it. espeak records the spoken playlist names the product suite
      # reads back, and ffmpeg encodes the demo fixture's tracks and cover art,
      # without which tools/demo-library.py refuses to build anything. Both are
      # declared capabilities in tools/check.py, so an image that stopped
      # shipping one fails the profile rather than quietly weakening it.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 shellcheck xvfb dbus \
            espeak ffmpeg

      # The same uv environment shape install.sh builds - distro Python and its
      # GTK bindings plus the project's own packages - so the tag reader the
      # screenshot fixture needs exercises the installed environment contract
      # rather than a second, test-only dependency setup.
      - name: Python environment
        run: |
          uv venv \
            --python /usr/bin/python3 \
            --system-site-packages \
            "${RUNNER_TEMP}/tag-venv"
          uv pip sync \
            --python "${RUNNER_TEMP}/tag-venv/bin/python" \
            requirements.txt

      # Hardware-validated database builder revision used by product E2E.
      - name: Fetch upstream database builder
        env:
          IPOD_BUILDER_REVISION: a97a99ab8623f0eccc5adcb8ebbdb2e626c6c703
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/nims11/IPod-Shuffle-4g.git \
            "${RUNNER_TEMP}/IPod-Shuffle-4g"
          git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" fetch --depth 1 origin \
            "${IPOD_BUILDER_REVISION}"
          git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" rev-parse HEAD)" = \
            "${IPOD_BUILDER_REVISION}"

      # The repository runner owns the complete required check set. It runs the
      # independent ones concurrently and prints their captured output in
      # declaration order, reporting each check on stderr as it finishes so a
      # long profile is not a silent step. Every check also leaves its output
      # in CHECK_EVIDENCE_DIR for the upload below.
      - name: Full validation profile
        env:
          SCREENSHOT_EVIDENCE_DIR: ${{ runner.temp }}/screenshots
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
          CHECK_EVIDENCE_DIR: ${{ runner.temp }}/check-evidence
          IPOD_VENV_PYTHON: ${{ runner.temp }}/tag-venv/bin/python
          IPOD_REAL_DB_TOOL: ${{ runner.temp }}/IPod-Shuffle-4g/ipod-shuffle-4g.py
        run: python3 tools/check.py full

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/check-evidence
          if-no-files-found: warn
