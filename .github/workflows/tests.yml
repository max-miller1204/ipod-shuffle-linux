---
name: tests

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The GUI smoke tests import the ipod_gui package, which imports
      # PyGObject at module level, so the bindings are needed even though most
      # of them never open a window. They come from the distribution because
      # building PyGObject from pip would need the gobject-introspection and
      # cairo development headers. xvfb is for the one check that does build a
      # window: GTK4 has no headless backend, so it needs a display server
      # rather than an environment variable.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 shellcheck xvfb

      - name: Shell lint
        run: shellcheck -x ./*.sh tests/product-e2e.sh

      # Architecture tooling gated at lint time, not a behavioural check.
      - name: Mixin contract
        run: python3 tools/mixin-contract.py

      # The demo builder rebuilds by deleting the directory it is handed, so
      # the guard deciding whether it may is checked on its own. It needs no
      # display and no ffmpeg, and it is the only step covering a path that
      # cannot be undone by rerunning anything.
      - name: Demo library guard
        run: python3 tests/demo-library-guard.py

      # Compiling catches a syntax error in any file, and the import catches
      # what compiling cannot now that the GUI is a package: a name that moved
      # to another module and left an import behind pointing at nothing.
      - name: Python syntax
        run: |
          python3 -m py_compile ipod-gui.py ipod_gui/*.py tests/*.py tools/*.py
          python3 -c 'import ipod_gui'

      # Needs a main loop but no display. A scan used to rebuild the whole
      # grid per batch, so a card was replaced under the pointer that was
      # hovering it - which is the flicker this answers - and any menu open
      # over the grid lost the widget holding the focus.
      - name: GUI repaints coalesce
        run: python3 tests/gui-repaint-coalescing.py

      # Also a main loop and no display. The refresh button's spinner is held
      # to a minimum so a scan that finishes instantly still looks like work,
      # and the timing is the whole of it: there is nothing to see in a
      # screenshot of a button that has already stopped.
      - name: GUI refresh spinner
        run: python3 tests/gui-refresh-spinner.py

      # The only check that constructs the window. Every other GUI check runs
      # methods unbound against a stand-in, so none of them would notice a
      # builder that stopped being called or a widget that never reached the
      # stack. -a picks a free display number rather than assuming :99 is free.
      - name: GUI window builds
        run: xvfb-run -a python3 tests/gui-window-build.py

      # A window narrower than its own contents does not clip: GTK paints
      # widgets outside the space it allocated them, so clicks stop landing on
      # what is under the pointer. This measures every page against the
      # minimum size the window advertises, which is the only way that gap
      # shows up before somebody drags the window narrow.
      - name: GUI window fits its minimum
        run: xvfb-run -a python3 tests/gui-window-minimum.py

      # The suite's playlist check runs the real upstream builder against the
      # rewritten list a sync produces, which the fake builder cannot vouch
      # for. This is the hardware-validated revision; bump it only after
      # validating the replacement against real hardware.
      - name: Fetch upstream database builder
        env:
          IPOD_BUILDER_REVISION: a97a99ab8623f0eccc5adcb8ebbdb2e626c6c703
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/nims11/IPod-Shuffle-4g.git \
            "${RUNNER_TEMP}/IPod-Shuffle-4g"
          git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" fetch --depth 1 origin \
            "${IPOD_BUILDER_REVISION}"
          git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" rev-parse HEAD)" = \
            "${IPOD_BUILDER_REVISION}"

      # Never run as root. The suite checks that a volume it cannot write to
      # produces a loud failure, and root ignores the permission bits that
      # check depends on, which would silently reduce its coverage.
      - name: End-to-end suite
        run: |
          test "$(id -u)" -ne 0 || { echo "must not run as root" >&2; exit 1; }
          tool_dir="${RUNNER_TEMP}/IPod-Shuffle-4g"
          EVIDENCE_DIR="${RUNNER_TEMP}/evidence" \
            IPOD_REAL_DB_TOOL="$tool_dir/ipod-shuffle-4g.py" \
            bash tests/product-e2e.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
