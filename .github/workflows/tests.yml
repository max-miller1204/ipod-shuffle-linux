---
name: tests

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The GUI smoke tests import the ipod_gui package, which imports
      # PyGObject at module level, so the bindings are needed even though no
      # window is ever opened. They come from the distribution because building
      # PyGObject from pip would need the gobject-introspection and cairo
      # development headers.
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 shellcheck

      - name: Shell lint
        run: shellcheck -x ./*.sh tests/product-e2e.sh

      # Compiling catches a syntax error in any file, and the import catches
      # what compiling cannot now that the GUI is a package: a name that moved
      # to another module and left an import behind pointing at nothing.
      - name: Python syntax
        run: |
          python3 -m py_compile ipod-gui.py ipod_gui/*.py tests/*.py
          python3 -c 'import ipod_gui'

      # The suite's playlist check runs the real upstream builder against the
      # rewritten list a sync produces, which the fake builder cannot vouch
      # for. This is the hardware-validated revision; bump it only after
      # validating the replacement against real hardware.
      - name: Fetch upstream database builder
        env:
          IPOD_BUILDER_REVISION: a97a99ab8623f0eccc5adcb8ebbdb2e626c6c703
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/nims11/IPod-Shuffle-4g.git \
            "${RUNNER_TEMP}/IPod-Shuffle-4g"
          git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" fetch --depth 1 origin \
            "${IPOD_BUILDER_REVISION}"
          git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" checkout --detach FETCH_HEAD
          test "$(git -C "${RUNNER_TEMP}/IPod-Shuffle-4g" rev-parse HEAD)" = \
            "${IPOD_BUILDER_REVISION}"

      # Never run as root. The suite checks that a volume it cannot write to
      # produces a loud failure, and root ignores the permission bits that
      # check depends on, which would silently reduce its coverage.
      - name: End-to-end suite
        run: |
          test "$(id -u)" -ne 0 || { echo "must not run as root" >&2; exit 1; }
          tool_dir="${RUNNER_TEMP}/IPod-Shuffle-4g"
          EVIDENCE_DIR="${RUNNER_TEMP}/evidence" \
            IPOD_REAL_DB_TOOL="$tool_dir/ipod-shuffle-4g.py" \
            bash tests/product-e2e.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
